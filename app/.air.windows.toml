root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/mrav.exe ./cmd/mrav"
  entrypoint = ["./tmp/mrav.exe"]
  include_ext = ["go", "sqlite"]
  include_dir = ["../data"]
  exclude_dir = ["tmp", "bin", "mock"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true
